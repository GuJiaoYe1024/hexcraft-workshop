plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

group = 'com.hexworkshop'
version = "${minecraft_version}-${mod_version}"

base {
    archivesName = 'hexworkshop'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mappings_channel, version: mappings_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'hexworkshop'
            mods {
                hexworkshop {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'hexworkshop'
            mods {
                hexworkshop {
                    source sourceSets.main
                }
            }
        }
        gameTestServer {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'hexworkshop'
            property 'forge.gameTestServer', 'true'
            mods {
                hexworkshop {
                    source sourceSets.main
                }
            }
        }
        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'hexworkshop', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                hexworkshop {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.shedaniel.me/' }   // Cloth Config
    maven { url = 'https://code.redspace.io/releases' } // Iron's Spells 'n Spellbooks 官方 maven
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Cloth Config API（运行时由正式客户端的 Cloth Config v10 提供；此处仅编译期引用）
    implementation fg.deobf("me.shedaniel.cloth:cloth-config-forge:11.1.136")
    // v0.6.20 Iron's Spells 'n Spellbooks 法术联动（compileOnly：仅编译期 API，不打包进产物；
    // 运行时按 ModList.isLoaded 守卫，未安装该 mod 时联动代码不加载、联动内容自动隐藏）
    // v0.9.8：编译依赖与正式客户端对齐（3.16.3），避免编译期 3.16.2 与运行期 API 差异
    compileOnly fg.deobf(files("H:/MC1314/.minecraft/versions/1.20.1-Forge_47.4.23/mods/irons_spellbooks-1.20.1-3.16.3.jar"))
    // v0.6.21 冰与火之歌（Ice and Fire CE）联动（compileOnly：仅引用实体/伤害注册常量；未安装时联动内容自动隐藏）
    compileOnly fg.deobf(files("H:/MC1314/.minecraft/versions/Create-Delight-Remake/mods/iceandfire-2.1.13-1.20.1-beta-5.jar"))
    // v0.9.7 FTB Quests 真联动（compileOnly：仅编译期 API，不打包进产物；正式客户端由用户 PCL 安装。
    // FTB 事件基于 architectury Event，编译期需 ftb-quests + ftb-library + ftb-teams + architectury 四 jar 可见）
    compileOnly fg.deobf(files("H:/MC1314/.minecraft/versions/1.20.1-Forge_47.4.23/mods/ftb-quests-forge-2001.4.22.jar"))
    compileOnly fg.deobf(files("H:/MC1314/.minecraft/versions/1.20.1-Forge_47.4.23/mods/ftb-library-forge-2001.2.13.jar"))
    compileOnly fg.deobf(files("H:/MC1314/.minecraft/versions/1.20.1-Forge_47.4.23/mods/ftb-teams-forge-2001.3.2.jar"))
    compileOnly fg.deobf(files("H:/MC1314/.minecraft/versions/1.20.1-Forge_47.4.23/mods/architectury-9.2.14-forge.jar"))
}

jar {
    // gameteststructures 只在开发环境跑 GameTest 用（StructureUtils 读文件系统路径，不读 jar 内资源），
    // 打进产物没有任何运行时作用，排除掉保持 jar 干净。
    exclude 'gameteststructures/**'
    manifest {
        attributes([
            "Specification-Title"     : "hexworkshop",
            "Specification-Vendor"    : mod_authors,
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : mod_version,
            "Implementation-Vendor"   : mod_authors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// GameTest 的结构模板必须放在 run/gameteststructures 下（Forge 的 StructureUtils 从文件系统读，
// 不认 jar 里的资源，也不认数据包里的 .snbt）。模板本身放在 src/main/resources 里跟代码一起受
// 版本控制，跑测试前由这个任务复制到 run/，这样别人 clone 后不用手动准备文件。
tasks.register('copyGameTestStructures', Copy) {
    from layout.projectDirectory.dir('src/main/resources/gameteststructures')
    into layout.projectDirectory.dir('run/gameteststructures')
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'copyGameTestStructures'
}
